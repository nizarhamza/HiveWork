<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ERP — Linear layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #0D0D0D;
    --sidebar-bg: #131315;
    --surface-raised: #1C1C1E;
    --overlay: rgba(255,255,255,0.04);
    --overlay-2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.11);
    --text: #F4F4F5;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --accent: #5E6AD2;
    --accent-hover: #6872D6;
    --success: #4CAF72;
    --warning: #F5A623;
    --sidebar: 232px;
    --header: 44px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  svg { display: block; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: var(--sidebar); flex: 0 0 var(--sidebar);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 8px;
  }
  /* Workspace switcher */
  .ws {
    display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 8px; border-radius: 6px;
    cursor: pointer;
  }
  .ws:hover { background: var(--overlay); }
  .ws-logo {
    width: 20px; height: 20px; border-radius: 5px;
    background: linear-gradient(135deg, #6872D6, #5E6AD2);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff;
    flex: 0 0 20px;
  }
  .ws-name { font-size: 13px; font-weight: 600; }
  .ws .chev { color: var(--text-3); margin-left: 2px; }
  .ws-actions { margin-left: auto; display: flex; gap: 2px; }
  .icon-btn {
    width: 24px; height: 24px; border-radius: 5px;
    display: grid; place-items: center;
    color: var(--text-3); cursor: pointer;
  }
  .icon-btn:hover { background: var(--overlay-2); color: var(--text-2); }

  .nav { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 8px; border-radius: 6px;
    color: var(--text-2); cursor: pointer; font-weight: 450;
  }
  .nav-item svg { color: var(--text-3); }
  .nav-item:hover { background: var(--overlay); color: var(--text); }
  .nav-item:hover svg { color: var(--text-2); }
  .nav-item.active { background: var(--overlay-2); color: var(--text); font-weight: 500; }
  .nav-item.active svg { color: var(--text); }
  .nav-item .badge { margin-left: auto; font-size: 11px; color: var(--text-3); }

  .section {
    display: flex; align-items: center; gap: 4px;
    padding: 14px 8px 4px;
    color: var(--text-3); font-size: 12px; font-weight: 500;
    cursor: default;
  }
  .section .chev { opacity: .7; }
  .section .add { margin-left: auto; opacity: 0; cursor: pointer; }
  .section:hover .add { opacity: 1; }

  .sidebar-spacer { flex: 1; }
  .user {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 8px; border-radius: 6px; cursor: pointer;
  }
  .user:hover { background: var(--overlay); }
  .avatar {
    width: 22px; height: 22px; border-radius: 999px;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 600; color: #fff; flex: 0 0 22px;
  }
  .user .name { font-size: 13px; color: var(--text-2); }

  /* ---------------- Content ---------------- */
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .toolbar {
    height: var(--header); flex: 0 0 var(--header);
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border);
  }
  .crumb { display: flex; align-items: center; gap: 7px; font-weight: 500; }
  .crumb svg { color: var(--text-2); }
  .tb-spacer { flex: 1; }
  .ghost {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 9px; border-radius: 6px;
    color: var(--text-2); font-size: 12px; font-weight: 450;
    background: transparent; border: none; cursor: pointer; font-family: inherit;
  }
  .ghost:hover { background: var(--overlay-2); color: var(--text); }
  .ghost svg { color: var(--text-3); }
  .new-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: 6px;
    color: var(--text); font-size: 12px; font-weight: 500;
    background: transparent; border: 1px solid var(--border-strong);
    cursor: pointer; font-family: inherit;
  }
  .new-btn:hover { background: var(--overlay-2); }

  /* group header (Linear-style) */
  .group {
    display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 16px;
    background: rgba(255,255,255,0.015);
    color: var(--text-2); font-size: 12px; font-weight: 500;
  }
  .group .count { color: var(--text-3); font-weight: 450; }
  .group .dot-sq { width: 9px; height: 9px; border-radius: 3px; background: var(--text-3); }

  /* rows */
  .row {
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 16px;
    border-bottom: 1px solid rgba(255,255,255,0.035);
    cursor: pointer;
  }
  .row:hover { background: var(--overlay); }
  .row .avatar { width: 20px; height: 20px; font-size: 9px; flex: 0 0 20px; }
  .r-name { color: var(--text); font-weight: 450; min-width: 150px; }
  .r-company { color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-email { color: var(--text-3); width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 5px; font-size: 11px; width: 78px;
  }
  .chip .d { width: 6px; height: 6px; border-radius: 999px; }
  .chip.active { color: var(--success); background: rgba(76,175,114,0.10); }
  .chip.active .d { background: var(--success); }
  .chip.lead { color: var(--warning); background: rgba(245,166,35,0.10); }
  .chip.lead .d { background: var(--warning); }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .r-email { display: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="ws">
        <div class="ws-logo">E</div>
        <span class="ws-name">Enernetpro</span>
        <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <div class="ws-actions">
          <div class="icon-btn" title="Search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
          <div class="icon-btn" title="New"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
        </div>
      </div>

      <div class="nav">
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>My work</div>
      </div>

      <div class="section">Workspace
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <svg class="add" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <div class="nav">
        <div class="nav-item active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>CRM</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Sales</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>Invoicing</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Projects</div>
      </div>

      <div class="section">Favorites
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="nav">
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Contacts<span class="badge">★</span></div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Active deals<span class="badge">★</span></div>
      </div>

      <div class="sidebar-spacer"></div>
      <div class="user">
        <div class="avatar" style="background:#6E56CF">NT</div>
        <span class="name">Nizar Thabouti</span>
      </div>
    </aside>

    <!-- Content -->
    <main class="content">
      <div class="toolbar">
        <div class="crumb">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Contacts
        </div>
        <div class="tb-spacer"></div>
        <button class="ghost"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>Filter</button>
        <button class="ghost"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>Display</button>
        <button class="new-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New contact</button>
      </div>

      <div class="group"><span class="dot-sq"></span>All contacts <span class="count">6</span></div>
      <div id="rows"></div>
    </main>
  </div>

  <script>
    const data = [
      ['Amira Ben Salah', 'Atlas Energy', 'amira@atlas.tn', 'Active', '#5E6AD2'],
      ['Youssef Trabelsi', 'SCATEC', 'y.trabelsi@scatec.com', 'Active', '#2BA87E'],
      ['Lina Haddad', 'STEG', 'l.haddad@steg.tn', 'Lead', '#D9730D'],
      ['Karim Mansour', 'Meknassy Infra', 'karim@meknassy.tn', 'Active', '#C2554D'],
      ['Sofia Rossi', 'Delta Grid', 'sofia@deltagrid.it', 'Lead', '#9D5BD2'],
      ['Omar Khaled', 'Sahara Solar', 'omar@saharasolar.tn', 'Active', '#3A87C2'],
    ];
    const initials = n => n.split(' ').map(w => w[0]).slice(0,2).join('');
    document.getElementById('rows').innerHTML = data.map(([name, company, email, status, color]) => {
      const cls = status === 'Lead' ? 'lead' : 'active';
      return `<div class="row">
        <div class="avatar" style="background:${color}">${initials(name)}</div>
        <span class="r-name">${name}</span>
        <span class="r-company">${company}</span>
        <span class="r-email">${email}</span>
        <span class="chip ${cls}"><span class="d"></span>${status}</span>
      </div>`;
    }).join('');

    document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
    }));
  </script>
</body>
</html>
